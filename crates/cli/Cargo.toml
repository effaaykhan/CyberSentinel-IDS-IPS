[package]
name = "cybersentinel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CyberSentinel-IPS — standalone host- and network-based intrusion detection sensor"
readme = "../../README.md"

[lints]
workspace = true

[[bin]]
name = "cybersentinel"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
cybersentinel-capture.workspace = true
cybersentinel-common.workspace = true
cybersentinel-decode.workspace = true
cybersentinel-correlation.workspace = true
cybersentinel-engine.workspace = true
cybersentinel-hids.workspace = true
cybersentinel-prevent.workspace = true
cybersentinel-reassembly.workspace = true
cybersentinel-rules.workspace = true
cybersentinel-storage.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Naming the one capability host monitoring retains. Linux-only, like the
# capability model itself.
[target.'cfg(target_os = "linux")'.dependencies]
caps.workspace = true

[dev-dependencies]
serde_json.workspace = true

# ---------------------------------------------------------------------------
# Linux packaging. Two formats, one set of installed files:
#
#   cargo deb          -p cybersentinel   # Debian, Ubuntu
#   cargo generate-rpm -p crates/cli      # RHEL, Fedora, SUSE
#
# Both install the same binary, the same /etc/cybersentinel/config.yaml, the
# same ruleset, and the same systemd unit — so a bug reproduced on one distro
# family is reproducible on the other. See packaging/linux/README.md.
# ---------------------------------------------------------------------------
[package.metadata.deb]
name = "cybersentinel"
maintainer = "CyberSentinel <security@example.invalid>"
copyright = "2026, CyberSentinel contributors"
extended-description = """\
CyberSentinel-IPS is a standalone intrusion detection sensor combining \
host-based (FIM, auth/log, process) and network-based monitoring in one \
self-contained binary. Detection-only: it alerts, it does not block. \
Rules use CyberSentinel's own .rules format and events are emitted as \
newline-delimited CyberSentinel event JSON."""
section = "admin"
priority = "optional"
# Declared rather than left to dpkg-shlibdeps, and the reason is subtle enough
# to be worth writing down.
#
# The portable build targets glibc 2.28 (see packaging/linux/README.md), where
# libpthread and libdl were still separate libraries. Building it on a modern
# host, shlibdeps sees NEEDED entries for libpthread.so.0 and libdl.so.2, maps
# them to the merged libc6 that provides those sonames as stubs, and concludes
# `libc6 (>= 2.34)`. That would refuse to install on exactly the older distros
# the pinned build exists to reach — a portability build defeated by its own
# packaging metadata.
#
# `libpcap0.8` rather than `libpcap0.8t64`: Ubuntu 24.04 renamed the package
# for the time64 transition but has it Provides: libpcap0.8, so the old name
# resolves on every Debian and Ubuntu still receiving updates.
depends = "libc6 (>= 2.28), libpcap0.8"
assets = [
    ["target/release/cybersentinel", "usr/bin/", "755"],
    ["../../packaging/linux/config.yaml", "etc/cybersentinel/config.yaml", "644"],
    ["../../rules/cybersentinel.rules", "etc/cybersentinel/rules/cybersentinel.rules", "644"],
    ["../../README.md", "usr/share/doc/cybersentinel/README.md", "644"],
    ["../../packaging/linux/logrotate", "etc/logrotate.d/cybersentinel", "644"],
    # The checks behind CLAUDE.md §8, shipped so an operator can run them on
    # their own machine rather than trust ours.
    ["../../packaging/linux/verify-install.sh", "usr/share/doc/cybersentinel/verify-install.sh", "755"],
    # An operator arming inline prevention needs to measure it first; shipping
    # the tools beside the sensor is what makes that advice actionable.
    ["../../packaging/linux/measure-prevention.sh", "usr/share/doc/cybersentinel/measure-prevention.sh", "755"],
    ["../../packaging/linux/soak-prevention.sh", "usr/share/doc/cybersentinel/soak-prevention.sh", "755"],
    # Shipped so a host can be cleaned up without fetching anything. It
    # re-execs from a copy first, because the package removal below would
    # otherwise delete it mid-run.
    ["../../packaging/linux/uninstall.sh", "usr/share/doc/cybersentinel/uninstall.sh", "755"],
]
conf-files = ["/etc/cybersentinel/config.yaml", "/etc/cybersentinel/rules/cybersentinel.rules"]
# cargo-deb generates the maintainer scripts that register the unit. The service
# is enabled but not started by the package: a sensor should be started once its
# operator has reviewed the installed config.
#
# `maintainer-scripts` is load-bearing and easy to leave out. cargo-deb's
# `generate_scripts` returns early when it is unset, so `systemd-units` on its
# own installs the unit file and generates **nothing** to register it: no
# `daemon-reload`, no `enable`. The package looks right — the unit is in the
# listing — and the sensor silently does not come back after a reboot. Pointing
# it at a directory with no maintainer scripts in it is what makes cargo-deb
# write the generated ones.
maintainer-scripts = "../../packaging/linux/maintainer"
systemd-units = { unit-name = "cybersentinel-ips", unit-scripts = "../../packaging/linux", enable = true, start = false }

# ---------------------------------------------------------------------------
# RPM packaging (`cargo generate-rpm -p crates/cli`).
#
# cargo-generate-rpm reads the built binary rather than invoking rpmbuild, so
# the CI runner needs no RPM toolchain — only the same `cargo build --release`
# the .deb uses. `--payload-compress none` is not set: the default is fine.
# ---------------------------------------------------------------------------
[package.metadata.generate-rpm]
name = "cybersentinel"
summary = "Standalone host and network intrusion detection sensor"
license = "MIT OR Apache-2.0"
url = "https://github.com/cybersentinel/cybersentinel-IPS"
# Everything the .deb installs, in the same places.
assets = [
    { source = "target/release/cybersentinel", dest = "/usr/bin/cybersentinel", mode = "755" },
    { source = "packaging/linux/config.yaml", dest = "/etc/cybersentinel/config.yaml", mode = "644", config = true },
    { source = "rules/cybersentinel.rules", dest = "/etc/cybersentinel/rules/cybersentinel.rules", mode = "644", config = true },
    { source = "packaging/linux/uninstall.sh", dest = "/usr/share/doc/cybersentinel/uninstall.sh", mode = "755" },
    { source = "packaging/linux/cybersentinel-ips.service", dest = "/usr/lib/systemd/system/cybersentinel-ips.service", mode = "644" },
    { source = "packaging/linux/logrotate", dest = "/etc/logrotate.d/cybersentinel", mode = "644", config = true },
    { source = "README.md", dest = "/usr/share/doc/cybersentinel/README.md", mode = "644", doc = true },
    { source = "packaging/linux/verify-install.sh", dest = "/usr/share/doc/cybersentinel/verify-install.sh", mode = "755" },
    { source = "packaging/linux/measure-prevention.sh", dest = "/usr/share/doc/cybersentinel/measure-prevention.sh", mode = "755" },
    { source = "packaging/linux/soak-prevention.sh", dest = "/usr/share/doc/cybersentinel/soak-prevention.sh", mode = "755" },
]

# systemd registration, matching what cargo-deb generates for the .deb. The
# scriptlets are files rather than inline strings so they are reviewable, and
# shared with anything else that needs them.
pre_install_script = "../../packaging/linux/rpm-pre-install.sh"
post_install_script = "../../packaging/linux/rpm-post-install.sh"
pre_uninstall_script = "../../packaging/linux/rpm-pre-uninstall.sh"
post_uninstall_script = "../../packaging/linux/rpm-post-uninstall.sh"

# Live capture links libpcap at runtime. Named explicitly rather than left to
# auto-detection because a sensor installed without it starts, reports that
# capture is unavailable, and monitors only the host — which is a coverage gap
# an operator would have to notice for themselves.
#
# The package name differs across the RPM distros, so the dependency is on the
# soname the linker actually recorded. Every one of them provides it.
[package.metadata.generate-rpm.requires]
"libpcap.so.0.8()(64bit)" = "*"
