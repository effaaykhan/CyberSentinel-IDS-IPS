[package]
name = "cybersentinel-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone workspace: cargo-fuzz builds with `-Z sanitizer` on nightly and
# must not be pulled into the stable workspace build. The root Cargo.toml
# excludes this directory for the same reason.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cybersentinel-capture = { path = "../crates/capture" }
cybersentinel-applayer = { path = "../crates/applayer" }
cybersentinel-common = { path = "../crates/common" }
cybersentinel-engine = { path = "../crates/engine" }
cybersentinel-decode = { path = "../crates/decode" }
cybersentinel-reassembly = { path = "../crates/reassembly" }
cybersentinel-rules = { path = "../crates/rules" }

[profile.release]
debug = true

# ---------------------------------------------------------------------------
# Guide §6: fuzz the rule parser, the decoder, and the reassembler. Each target
# is added by the phase that introduces the code it covers. `reassembler`
# follows in Phase 2.
# ---------------------------------------------------------------------------

[[bin]]
name = "rule_parser"
path = "fuzz_targets/rule_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rule_file"
path = "fuzz_targets/rule_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decoder"
path = "fuzz_targets/decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pcap_reader"
path = "fuzz_targets/pcap_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reassembler"
path = "fuzz_targets/reassembler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalization"
path = "fuzz_targets/normalization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_parser"
path = "fuzz_targets/http_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rule_engine"
path = "fuzz_targets/rule_engine.rs"
test = false
doc = false
bench = false
