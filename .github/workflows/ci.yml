name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Only first-party actions are used. A third-party action runs with access to
# this repository's build; for a security tool, that supply chain is worth
# keeping short. The Rust toolchain comes from the rustup that every GitHub
# runner already ships.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Acceptance criterion: builds and tests pass on Linux, Windows, and macOS,
  # and `cybersentinel run` actually runs on all three.
  # -------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Live capture links against libpcap; macOS ships it, Linux needs the
      # headers. Windows has neither and builds without a live backend until
      # Phase 5 — replaying .pcap files needs none of this, which is why the
      # decode tests run everywhere. See crates/capture/README.md.
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install the Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version && cargo --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `-D warnings` here rather than in RUSTFLAGS: a global RUSTFLAGS would
      # also apply to `cargo install` of the packaging tools, failing the build
      # on warnings in code we do not own. clippy runs the rustc lints too, so
      # nothing is lost.
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # rusqlite is built with `bundled`, which compiles SQLite's C sources
      # with the runner's own C toolchain: cc on Linux, clang on macOS, MSVC on
      # Windows. That is the one part of the build that is not Rust, and it is
      # the part most likely to differ per platform — so it gets a step of its
      # own rather than being buried in the workspace build, where a failure
      # would read as "something in the workspace broke".
      #
      # The FIM baseline is a SQLite database. If this step fails, host
      # monitoring has no persistent baseline on that OS, and the option to
      # discuss is a pure-Rust store (see packaging/README.md).
      - name: Build the bundled SQLite (the C part of the build)
        run: cargo build -p cybersentinel-hids

      - name: Build
        run: cargo build --workspace

      # Cross-compile the whole workspace, tests included, for Windows from the
      # Linux runner. The windows-latest leg of this matrix is the real check —
      # it uses MSVC, which this does not — but that leg is also the one most
      # likely to be unavailable in a given environment, and a portability
      # regression should not wait for it. mingw catches missing platform gates
      # and unported code the moment they land.
      - name: Cross-compile for Windows (portability guard)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
          cargo build --workspace --tests --target x86_64-pc-windows-gnu

      - name: Test
        run: cargo test --workspace

      # And prove the compiled SQLite actually works, not merely that it
      # linked: this is the FIM baseline round-tripping on this OS.
      - name: Test the FIM baseline (bundled SQLite at runtime)
        run: cargo test -p cybersentinel-hids -- "fim::"

      # The acceptance criterion is that the sensor *runs* on this OS with the
      # shipped config — not merely that it compiles. `--once` exercises the
      # whole startup path (config, rules, identity, pipeline, both sinks) and
      # exits.
      #
      # The detailed shape of the event is asserted by the integration tests in
      # `crates/cli/tests/run_once.rs`, which ran in the step above on this same
      # OS. This step checks the shipped `config/config.yaml` and default
      # ruleset specifically, which those tests deliberately do not use.
      - name: Smoke test — run the sensor with the shipped config
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -p cybersentinel -- \
            run --config config/config.yaml --once > stats.json

          echo "--- emitted event ---"
          cat stats.json

          test -s stats.json                    || { echo "no event was emitted"; exit 1; }
          test "$(wc -l < stats.json)" -eq 1    || { echo "expected exactly one event"; exit 1; }
          test -s logs/events.json              || { echo "the file sink wrote nothing"; exit 1; }
          cmp -s stats.json logs/events.json    || { echo "the two sinks disagree"; exit 1; }

          grep -q '"event_type":"stats"' stats.json  || { echo "not a stats event"; exit 1; }
          grep -qE '"timestamp":"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}Z"' stats.json \
            || { echo "timestamp is not UTC with sub-second precision"; exit 1; }
          grep -q '"dropped":0' stats.json      || { echo "events were dropped at startup"; exit 1; }
          if grep -q '"loaded":0' stats.json; then echo "the default ruleset did not load"; exit 1; fi

          echo "stats event OK"

      # The Phase 1 acceptance criterion: the full capture -> decode -> flow
      # pipeline runs from a capture file, with no privileges and no NIC. This
      # is the same path on every OS.
      - name: Smoke test — replay the pcap fixtures
        shell: bash
        run: |
          set -euo pipefail

          cargo run --quiet -p cybersentinel -- run \
            --config config/config.yaml \
            --replay tests/fixtures/pcap/normal.pcap > normal.json

          echo "--- flow events ---"
          grep '"event_type":"flow"' normal.json

          flows=$(grep -c '"event_type":"flow"' normal.json || true)
          test "$flows" -eq 5 || { echo "expected 5 flow events, got $flows"; exit 1; }
          grep -q '"reason":"closed"' normal.json      || { echo "no closed flow"; exit 1; }
          grep -q '"proto":"ICMP"' normal.json         || { echo "ICMP flow missing"; exit 1; }
          grep -q '"src_ip":"2001:db8::10"' normal.json || { echo "IPv6 flow missing"; exit 1; }

          cargo run --quiet -p cybersentinel -- run \
            --config config/config.yaml \
            --replay tests/fixtures/pcap/malformed.pcap > malformed.json

          anomalies=$(grep -c '"event_type":"anomaly"' malformed.json || true)
          test "$anomalies" -eq 14 \
            || { echo "expected 14 anomaly events, got $anomalies"; exit 1; }
          grep -q '"anomalous":14' malformed.json \
            || { echo "anomaly counters missing from stats"; exit 1; }

          echo "replay OK: $flows flows, $anomalies anomalies"

      # The Phase 2 acceptance criteria, end to end: the same capture must
      # produce different reassembled streams under the two overlap policies,
      # and the injection and teardown tricks in it must not work.
      - name: Smoke test — the evasion fixture under both overlap policies
        shell: bash
        run: |
          set -euo pipefail

          run_policy() {
            local policy="$1" outdir="$2"
            rm -rf "$outdir" evasion-state
            mkdir -p "$outdir"
            cat > evasion.yaml <<YAML
          paths:
            data-dir: evasion-state
            log-dir: evasion-state
          rules:
            files: []
          outputs:
            stdout:
              enabled: true
            file:
              enabled: false
          logging:
            level: warn
          reassembly:
            overlap-policy: ${policy}
          YAML
            cargo run --quiet -p cybersentinel -- run \
              --config evasion.yaml \
              --replay tests/fixtures/pcap/evasion.pcap \
              --dump-streams "$outdir" > "evasion-${policy}.json"
            cat "$outdir"/*-to-server.bin > "streams-${policy}.txt"
          }

          run_policy first first-streams
          run_policy last  last-streams

          echo "--- reassembled streams (first) ---"; cat streams-first.txt; echo
          echo "--- reassembled streams (last) ---";  cat streams-last.txt;  echo

          # Split across TCP segments, and across IP fragments, both reassemble.
          grep -q 'ATTACK-PAYLOAD-MARKER' streams-first.txt \
            || { echo "the segmented marker did not reassemble"; exit 1; }
          grep -q 'FRAGMENTED-ATTACK-MARKER' streams-first.txt \
            || { echo "the fragmented marker did not reassemble"; exit 1; }

          # Contradicting overlaps resolve differently under the two policies.
          grep -q 'XXXXXXXX-TAIL' streams-first.txt \
            || { echo "first-wins did not keep the original bytes"; exit 1; }
          grep -q 'ATTACKED-TAIL' streams-last.txt \
            || { echo "last-wins did not take the newer bytes"; exit 1; }
          if grep -q 'ATTACKED' streams-first.txt; then
            echo "the contradicting copy leaked under first-wins"; exit 1
          fi

          # Injection and teardown tricks must not work.
          if grep -q 'EVIL' streams-first.txt; then
            echo "data past the FIN entered the stream"; exit 1
          fi
          grep -q 'BEFORE-AFTER-RESET' streams-first.txt \
            || { echo "a forged reset stopped the sensor watching"; exit 1; }
          grep -q '"resets_ignored":1' evasion-first.json \
            || { echo "the ignored reset is missing from stats"; exit 1; }

          echo "evasion suite OK"

      # The Phase 3 acceptance criteria: rules compile, and a rule fires on
      # every delivery in the evasion capture. A regression here is silent by
      # nature — the sensor keeps running and simply stops detecting.
      - name: Smoke test — rule validation and detection
        shell: bash
        run: |
          set -euo pipefail

          # The shipped ruleset must be loadable. It is allowed to contain
          # rules awaiting engine support; it is not allowed to contain broken
          # ones, which is what a non-zero exit here would mean.
          cargo run --quiet -p cybersentinel -- \
            validate-rules --config config/config.yaml

          rm -rf detect-state && mkdir -p detect-state
          cp tests/fixtures/rules/detection.rules detect-state/
          cp tests/fixtures/rules/http.rules detect-state/
          cat > detect.yaml <<YAML
          paths:
            data-dir: detect-state
            log-dir: detect-state
          rules:
            directory: detect-state
            files: [detection.rules]
          outputs:
            stdout:
              enabled: true
            file:
              enabled: false
          logging:
            level: warn
          reassembly:
            overlap-policy: last
          YAML

          cargo run --quiet -p cybersentinel -- run \
            --config detect.yaml --replay tests/fixtures/pcap/evasion.pcap > alerts.json

          echo "--- alerts ---"; grep '"event_type":"alert"' alerts.json || true

          # One rule per delivery: segmented (twice), overlap-last, pre-FIN,
          # survived-reset, defragmented.
          for sid in 9000001 9000002 9000004 9000006 9000007; do
            grep -q "\"sid\":${sid}," alerts.json \
              || { echo "rule ${sid} did not fire"; exit 1; }
          done
          test "$(grep -c '"sid":9000001,' alerts.json)" -eq 2 \
            || { echo "expected both segmented deliveries to fire"; exit 1; }

          # And the two that must not.
          if grep -q '"sid":9000005,' alerts.json; then
            echo "data past the FIN reached detection"; exit 1
          fi
          if grep -q '"sid":9000003,' alerts.json; then
            echo "the superseded overlap copy reached detection"; exit 1
          fi

          # HTTP: one rule, five spellings of the same request.
          #
          # Written without `sed -i`, which is not portable: GNU sed treats the
          # next argument as the script, BSD sed (macOS) treats it as a
          # mandatory backup suffix and then reads the filename as the script.
          # The macOS runner failed here with "extra characters at the end of d
          # command" while every detection in this step had already passed.
          sed 's/files: \[detection.rules\]/files: [http.rules]/' detect.yaml > http.yaml
          cargo run --quiet -p cybersentinel -- run \
            --config http.yaml --replay tests/fixtures/pcap/http.pcap > http-alerts.json
          test "$(grep -c '"sid":9100001,' http-alerts.json)" -eq 5 \
            || { echo "the URI rule did not match every spelling"; exit 1; }
          test "$(grep -c '"sid":9100002,' http-alerts.json)" -eq 1 \
            || { echo "the double-encoding rule fired wrongly"; exit 1; }

          echo "detection OK"

      - name: Verify --version
        run: cargo run --quiet -p cybersentinel -- --version

  # -------------------------------------------------------------------------
  # Acceptance criterion: CI produces at least one installable Linux package.
  # -------------------------------------------------------------------------
  package-linux:
    name: package (linux .deb + .rpm)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-deb-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-deb-

      - name: Install the packaging tools
        run: cargo install cargo-deb cargo-generate-rpm cargo-zigbuild --locked

      # zig is what pins the glibc baseline. Without it the packages would be
      # built against the runner's glibc (2.39 on ubuntu-latest) and would
      # refuse to install on RHEL 8, Debian 11, or Ubuntu 20.04 — all still in
      # support, and all machines somebody wants a sensor on.
      - name: Install zig
        run: |
          set -euo pipefail
          version=0.13.0
          curl -sSL "https://ziglang.org/download/$version/zig-linux-x86_64-$version.tar.xz" \
            | tar -xJ -C "$HOME"
          echo "$HOME/zig-linux-x86_64-$version" >> "$GITHUB_PATH"
          "$HOME/zig-linux-x86_64-$version/zig" version

      # One script builds both formats and asserts the two invariants that
      # matter: the glibc ceiling held, and the binary still links libpcap. A
      # portable build that dropped live capture would be portable and blind.
      - name: Build the packages
        run: sh packaging/linux/build-packages.sh

      # A package that builds but installs wrong is worse than no package: it
      # fails on the operator's machine instead of ours.
      - name: Verify the .deb
        run: |
          set -euo pipefail
          deb=$(ls target/debian/*.deb)
          echo "built $deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

          # Capture the listings ONCE, then grep the files.
          #
          # `dpkg-deb --contents "$deb" | grep -q ...` looks equivalent and is
          # not: grep -q exits on its first match, dpkg-deb's tar gets SIGPIPE
          # mid-write and returns non-zero, and `set -o pipefail` fails the
          # check even though the file was present. It passed locally and
          # failed on the runner — the timing decides whether tar has finished
          # writing before grep leaves. CI reported the sensor binary as
          # missing from a package that plainly contained it.
          dpkg-deb --contents "$deb" > deb-contents.txt
          dpkg-deb -f "$deb" Depends > deb-depends.txt

          for path in \
            ./usr/bin/cybersentinel \
            ./etc/cybersentinel/config.yaml \
            ./etc/cybersentinel/rules/cybersentinel.rules \
            ./etc/logrotate.d/cybersentinel
          do
            grep -q " $path\$" deb-contents.txt \
              || { echo "missing from the package: $path"; exit 1; }
          done

          grep -q "cybersentinel.service" deb-contents.txt \
            || { echo "the systemd unit is missing from the package"; exit 1; }

          # Live capture is a runtime dependency, not an optional extra: a
          # sensor installed without libpcap monitors only the host, and an
          # operator would have to notice that for themselves.
          grep -q "libpcap0.8" deb-depends.txt \
            || { echo "the .deb does not depend on libpcap"; exit 1; }
          # And the glibc floor must be the pinned one, not the runner's.
          grep -q "libc6 (>= 2.28)" deb-depends.txt \
            || { echo "the .deb declares the wrong glibc baseline"; exit 1; }

      - name: Verify the .rpm
        run: |
          set -euo pipefail
          sudo apt-get install -y rpm
          rpm=$(find target -name '*.rpm' | head -1)
          echo "built $rpm"
          rpm -qp --info "$rpm"
          rpm -qpl "$rpm"

          # Same reasoning as the .deb above: capture once, grep the files.
          rpm -qpl "$rpm" > rpm-files.txt
          rpm -qpc "$rpm" > rpm-config.txt
          rpm -qp --requires "$rpm" > rpm-requires.txt

          for path in \
            /usr/bin/cybersentinel \
            /etc/cybersentinel/config.yaml \
            /etc/cybersentinel/rules/cybersentinel.rules \
            /usr/lib/systemd/system/cybersentinel.service \
            /etc/logrotate.d/cybersentinel
          do
            grep -qx "$path" rpm-files.txt \
              || { echo "missing from the package: $path"; exit 1; }
          done

          # Config files must be marked as such, or an upgrade silently
          # overwrites an operator's tuning.
          grep -qx /etc/cybersentinel/config.yaml rpm-config.txt \
            || { echo "config.yaml is not marked as a config file"; exit 1; }

          grep -q "libpcap.so.0.8" rpm-requires.txt \
            || { echo "the .rpm does not depend on libpcap"; exit 1; }

          # The RPM derives per-symbol-version requires straight from the ELF,
          # so this is an independent check on the glibc pinning.
          highest=$(grep -oE 'GLIBC_[0-9.]+' rpm-requires.txt \
            | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "highest glibc requirement: $highest"
          [ "$(printf '2.28\n%s\n' "$highest" | sort -V | tail -1)" = "2.28" ] \
            || { echo "the .rpm needs GLIBC_$highest, above the 2.28 baseline"; exit 1; }

      - name: Install the .deb and run the installed sensor
        run: |
          set -euo pipefail
          sudo dpkg --install target/debian/*.deb
          /usr/bin/cybersentinel --version
          # Run against the *installed* config, as an operator would.
          sudo /usr/bin/cybersentinel run --config /etc/cybersentinel/config.yaml --once
          sudo test -s /var/log/cybersentinel/events.json
          # ... and that it can analyse a capture file.
          sudo /usr/bin/cybersentinel run \
            --config /etc/cybersentinel/config.yaml \
            --replay tests/fixtures/pcap/normal.pcap
          echo "installed sensor ran and wrote its event log"

      # The proof that CLAUDE.md §8 is right rather than merely written down:
      # start the service and assert the capability model on the running
      # process. GitHub runners have systemd, so this is the real thing.
      # The proof that CLAUDE.md §8 is right rather than merely written down.
      # The shipped config has capture off by default, so turn it on here: the
      # point of the check is that live capture still works *after* the sensor
      # has dropped CAP_NET_RAW, and a skipped capture check would let a
      # regression through.
      - name: Start the service and verify the capability model
        run: |
          set -euo pipefail
          iface=$(ip -o -4 route show default | awk '{print $5}' | head -1)
          echo "capturing on $iface"
          # Anchored to the capture: block. "The first enabled: false in the
          # file" would silently start editing the wrong section the moment one
          # is added above it.
          sudo python3 - "$iface" <<'PY'
          import re, sys
          path = "/etc/cybersentinel/config.yaml"
          text = open(path).read()
          block = re.search(r"^capture:\n(?:[ \t].*\n|\n)*", text, re.M)
          assert block, "no capture: section in the installed config"
          patched = block.group(0)
          patched = patched.replace("  enabled: false", "  enabled: true", 1)
          patched = patched.replace("  interfaces: []", f"  interfaces: [{sys.argv[1]}]", 1)
          assert "enabled: true" in patched and sys.argv[1] in patched, patched
          open(path, "w").write(text[:block.start()] + patched + text[block.end():])
          PY
          sudo sed -n '/^capture:/,/^decode:/p' /etc/cybersentinel/config.yaml

          sudo systemctl start cybersentinel
          # The first FIM baseline hashes /etc and /usr/bin; the shadow check
          # needs it finished.
          sleep 45
          sudo systemctl status cybersentinel --no-pager -n 20 || true
          sudo sh /usr/share/doc/cybersentinel/verify-install.sh

      - name: Show the sensor's own view of itself
        if: always()
        run: |
          sudo tail -3 /var/log/cybersentinel/events.json || true
          sudo journalctl -u cybersentinel --no-pager -n 40 || true

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: cybersentinel-linux-packages
          path: |
            target/debian/*.deb
            target/**/generate-rpm/*.rpm
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Guide §6: a crash in a parser is a vulnerability. Every phase that adds a
  # parser adds a fuzz target, and CI gives each one a short run so a
  # regression surfaces on the PR that caused it rather than months later.
  # -------------------------------------------------------------------------
  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      # libFuzzer needs nightly. `fuzz/rust-toolchain.toml` selects it for that
      # directory, so nothing here changes the default toolchain.
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install the toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Every parser that touches attacker-supplied input gets a short run, so a
      # regression surfaces on the PR that caused it rather than months later.
      # Build every target BEFORE running any of them.
      #
      # `fuzz/` is a separate workspace — deliberately, so nightly and the
      # sanitizer flags stay out of the stable build — which means
      # `cargo build --workspace` and `cargo clippy --workspace` never compile
      # it. A change to a type used by a fuzz target therefore breaks it
      # silently, and the break surfaces only when that target's turn comes
      # round. That is what happened: eleven targets ran clean for fifteen
      # minutes and the twelfth failed to compile, because a field added to
      # `QueuedPacket` was never threaded into it.
      #
      # Building first turns a fifteen-minute discovery into a thirty-second
      # one, and makes "does the fuzz crate still compile" a thing CI answers
      # on every run rather than only when a target happens to be reached.
      - name: Build every fuzz target
        working-directory: fuzz
        run: cargo fuzz build

      - name: Fuzz the parsers
        working-directory: fuzz
        run: |
          cargo fuzz run rule_parser -- -max_total_time=60 -print_final_stats=1
          cargo fuzz run rule_file   -- -max_total_time=60 -print_final_stats=1
          cargo fuzz run decoder     -- -max_total_time=90 -print_final_stats=1
          cargo fuzz run pcap_reader -- -max_total_time=90 -print_final_stats=1
          cargo fuzz run reassembler   -- -max_total_time=150 -print_final_stats=1
          cargo fuzz run normalization -- -max_total_time=90 -print_final_stats=1
          cargo fuzz run http_parser   -- -max_total_time=90 -print_final_stats=1
          cargo fuzz run rule_engine   -- -max_total_time=150 -print_final_stats=1
          # Phase 4's host-side parsers. Both read input an unprivileged local
          # user can influence — a username lands in the auth log verbatim, and
          # a process chooses its own name in /proc/<pid>/stat.
          cargo fuzz run auth_log     -- -max_total_time=90 -print_final_stats=1
          cargo fuzz run proc_reader  -- -max_total_time=90 -print_final_stats=1
          # The NTFS USN journal parser. It reads variable-length records out
          # of a kernel buffer, each declaring its own length and the offset of
          # its own filename — the input class this project keeps in-tree and
          # fuzzes rather than parsing behind an FFI boundary.
          cargo fuzz run usn_journal  -- -max_total_time=90 -print_final_stats=1
          # The inline verdict path. This one runs in-path on every packet with
          # the kernel waiting, so a panic is a stalled queue rather than a
          # crashed process — and past the queue bound that means the fail mode
          # applies to production traffic.
          cargo fuzz run verdict_path -- -max_total_time=90 -print_final_stats=1

      - name: Upload any crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
